<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<style>
*{margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
#wrap{position:relative;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#bubble{position:absolute;bottom:128px;left:50%;transform:translateX(-50%);background:#fff;border-radius:8px;padding:5px 9px;font-size:11px;max-width:150px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.1);opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;font-family:sans-serif}
#bubble.show{opacity:1}
#bubble.style-love{background:#ffe4ec}
#bubble.style-angry{background:#ffe0e0}
#bubble.style-whisper{background:#f0f0f0;color:#888}
#bubble.style-jealous{background:#e8ffe8}
#bubble.style-dizzy{background:#eee8ff}
#bubble::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;border-top:6px solid #fff}
#bubble.style-love::after{border-top-color:#ffe4ec}
#bubble.style-angry::after{border-top-color:#ffe0e0}
#bubble.style-whisper::after{border-top-color:#f0f0f0}
#bubble.style-jealous::after{border-top-color:#e8ffe8}
#bubble.style-dizzy::after{border-top-color:#eee8ff}
</style>
</head>
<body>
<div id="wrap">
<div id="bubble"></div>
<canvas id="c"></canvas>
</div>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const S=4,GW=32,GH=34;
cv.width=GW*S;cv.height=GH*S;
cv.style.width=(GW*S)+'px';cv.style.height=(GH*S)+'px';

let state='idle',tick=0,tapCount=0;
let flatH=0,facing=1,dizzyAngle=0;
let particles=[];

const C={
  body:'#E8734A',dk:'#C85A35',lt:'#F09070',lt2:'#F5A080',
  eye:'#1A1A1A',
  leg:'#C85A35',
  hat:'#5B4FCF',hatLt:'#7B6FEF',ball:'#FFFFFF',
  book:'#4A7ADB',page:'#FFFFF0',
  cam:'#2A2A2A',lens:'#5599FF',flash:'#FFEE55',
  brush:'#6B42A',tip:'#FF5599',
  easel:'#8B6B3A',canv:'#FFFFFF',
  headphone:'#4488DD',hpBand:'#3366BB',
  star:'#FFD700',heart:'#FF4466',smoke:'#999999',zzz:'#7788AA',
  wizard:'#4444AA',wizStar:'#FFDD44'
};

function px(x,y,c){if(x<0||y<0||x>=GW||y>=GH)return;cx.fillStyle=c;cx.fillRect(x*S,y*S,S,S);}
function rect(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(x*S,y*S,w*S,h*S);}

function drawBody(bx,by,bw,bh){
  rect(bx,by,bw,bh,C.body);
  rect(bx+1,by,bw-2,1,C.lt);
  rect(bx+2,by+1,bw-4,1,C.lt2);
  rect(bx,by+bh-1,bw,1,C.dk);
  rect(bx,by+1,1,bh-2,C.dk);
  rect(bx+bw-1,by+1,1,bh-2,C.dk);
}

function drawEyes(bx,by,bw,bh){
  const ey=by+Math.floor(bh*0.25);
  const lx=bx+Math.floor(bw*0.22);
  const rx=bx+Math.floor(bw*0.68);
  if(state==='sleep'||state==='flat'){
    rect(lx,ey+1,2,1,C.eye);rect(rx,ey+1,2,1,C.eye);
  } else if(state==='screenshot'||state==='happy'||state==='pet'){
    px(lx,ey+1,C.eye);px(lx+1,ey,C.eye);px(lx+2,ey+1,C.eye);
    px(rx,ey+1,C.eye);px(rx+1,ey,C.eye);px(rx+2,ey+1,C.eye);
  } else if(state==='angry'){
    px(lx,ey,C.eye);px(rx,ey,C.eye);
    px(lx,ey-1,C.eye);px(rx+1,ey-1,C.eye);
  } else if(state==='dizzy'){
    const o=Math.round(Math.sin(dizzyAngle)*1);
    px(lx+o,ey,C.eye);px(lx+1,ey+o,C.eye);
    px(rx+o,ey,C.eye);px(rx+1,ey+o,C.eye);
  } else {
    px(lx,ey,C.eye);px(rx,ey,C.eye);
  }
}

function drawMouth(bx,by,bw,bh){
  const my=by+Math.floor(bh*0.7);
  const mx=bx+Math.floor(bw/2);
  if(state==='happy'||state==='pet'||state==='screenshot'){
    px(mx-1,my,C.dk);px(mx,my+1,C.dk);px(mx+1,my,C.dk);
  } else if(state==='angry'){
    px(mx-1,my+1,C.eye);px(mx,my,C.eye);px(mx+1,my+1,C.eye);
  } else if(state==='dizzy'){
    px(mx,my,C.dk);px(mx,my+1,C.dk);
  } else if(state!=='sleep'&&state!=='flat'){
    px(mx,my,C.dk);
  }
}

function drawLegs(bx,by,bw,bh){
  const ly=by+bh;
  const positions=[bx+2,bx+4,bx+bw-3,bx+bw-5];
  if(bw>=10){positions.push(bx+Math.floor(bw/2)-1);positions.push(bx+Math.floor(bw/2)+1);}
  positions.forEach((lx,i)=>{
    const off=(state==='walk')?Math.round(Math.sin(tick*0.35+i*1.8)):0;
    const len=(state==='flat')?1:3;
    for(let j=0;j<len;j++) px(lx,ly+j+off,C.leg);
  });
}

function drawShadow(bx,by,bw,bh){
  const sy=by+bh+(state==='flat'?2:4);
  cx.globalAlpha=0.06;rect(bx-1,sy,bw+2,1,'#000');cx.globalAlpha=1;
}

function drawSleepHat(bx,by,bw){
  const hx=bx+Math.floor(bw/2)-2;
  rect(hx-1,by-1,6,1,C.hat);
  rect(hx,by-2,4,1,C.hat);
  rect(hx+1,by-3,3,1,C.hatLt);
  px(hx+2,by-4,C.hatLt);
  px(hx+3,by-4,C.ball);px(hx+4,by-5,C.ball);
}

function drawBook(bx,by,bw,bh){
  const side=bx+bw+1;
  const bookY=by+Math.floor(bh/2)-2;
  rect(side,bookY,4,5,C.book);
  rect(side+1,bookY+1,2,3,C.page);
}

function drawCamera(bx,by,bw){
  const camX=bx+Math.floor(bw/2)-2;const camY=by-4;
  rect(camX,camY,5,3,C.cam);
  rect(camX+1,camY-1,3,1,C.cam);
  px(camX+2,camY+1,C.lens);px(camX+3,camY+1,C.lens);
  if(tick%18<4){px(camX+5,camY-1,C.flash);px(camX+4,camY-2,C.flash);}
}

function drawPaint(bx,by,bw,bh){
  const ex=bx+bw+2;const ey=by+1;
  rect(ex,ey,5,5,C.canv);
  px(ex,ey+6,C.easel);px(ex+4,ey+6,C.easel);
  px(ex+1,ey+1,C.tip);px(ex+2,ey+3,'#5599FF');px(ex+3,ey+2,'#55CC55');
  px(bx+bw,by+Math.floor(bh/2),C.brush);
  px(bx+bw+1,by+Math.floor(bh/2)-1,C.tip);
}

function drawHeadphones(bx,by,bw){
  rect(bx-1,by+2,2,3,C.headphone);
  rect(bx+bw-1,by+2,2,3,C.headphone);
  rect(bx+2,by-2,bw-4,1,C.hpBand);
  px(bx+1,by-1,C.hpBand);px(bx+bw-2,by-1,C.hpBand);
}

function drawWizardHat(bx,by,bw){
  const hx=bx+Math.floor(bw/2)-2;
  rect(hx-1,by-1,7,1,C.wizard);
  rect(hx,by-2,5,1,C.wizard);
  rect(hx+1,by-3,3,1,C.wizard);
  px(hx+2,by-4,C.wizard);px(hx+2,by-5,C.wizard);
  px(hx,by-2,C.wizStar);px(hx+3,by-3,C.wizStar);px(hx+1,by-4,C.wizStar);
}

function drawThink(bx,by,bw){
  const tx=bx+bw+2,ty=by-3;
  px(tx,ty+2,C.zzz);px(tx+1,ty+1,C.zzz);
  rect(tx+1,ty-1,3,2,'#FFFFFF');
  px(tx+2,ty-1,C.eye);px(tx+3,ty-1,C.eye);px(tx+4,ty-1,C.eye);
}

function addP(x,y,color){particles.push({x:x,y:y,color:color,life:1,vy:0.3+Math.random()*0.4,vx:(Math.random()-0.5)*0.5});}
function drawParticles(){
  particles.forEach((p,i)=>{
    cx.globalAlpha=p.life;px(Math.round(p.x),Math.round(p.y),p.color);cx.globalAlpha=1;
    p.y-=p.vy;p.x+=p.vx;p.life-=0.022;
    if(p.life<=0)particles.splice(i,1);
  });
}

function draw(){
  tick++;
  cx.clearRect(0,0,cv.width,cv.height);

  let bw=12+Math.round(flatH*5);
  let bh=10-Math.round(flatH*5);
  if(state==='flat')flatH=Math.min(1,flatH+0.05);
  else flatH=Math.max(0,flatH-0.04);
  bw=12+Math.round(flatH*5);bh=10-Math.round(flatH*5);

  let bx=Math.floor((GW-bw)/2);
  let by=Math.floor((GH-bh)/2)+3;

  if(state==='idle')by+=Math.round(Math.sin(tick*0.05)*0.8);
  else if(state==='walk')by+=Math.round(Math.abs(Math.sin(tick*0.18))*-1.5);
  else if(state==='happy')by+=Math.round(Math.sin(tick*0.12)*1.5);
  else if(state==='pet')by+=Math.round(Math.sin(tick*0.09)*1);
  else if(state==='dizzy'){dizzyAngle+=0.2;by+=Math.round(Math.sin(dizzyAngle)*1);}

  cx.save();
  if(facing<0){cx.translate(cv.width,0);cx.scale(-1,1);}

  drawShadow(bx,by,bw,bh);
  // Hands
px(bx-1,by+Math.floor(bh/2),C.body);px(bx-2,by+Math.floor(bh/2),C.body);px(bx-1,by+Math.floor(bh/2)+1,C.dk);px(bx-2,by+Math.floor(bh/2)+1,C.dk);
px(bx+bw,by+Math.floor(bh/2),C.body);px(bx+bw+1,by+Math.floor(bh/2),C.body);px(bx+bw,by+Math.floor(bh/2)+1,C.dk);px(bx+bw+1,by+Math.floor(bh/2)+1,C.dk);
drawLegs(bx,by,bw,bh);
  drawBody(bx,by,bw,bh);
  drawEyes(bx,by,bw,bh);
  

  if(state==='sleep')drawSleepHat(bx,by,bw);
  if(state==='read')drawBook(bx,by,bw,bh);
  if(state==='screenshot')drawCamera(bx,by,bw);
  if(state==='paint')drawPaint(bx,by,bw,bh);
  if(state==='think')drawThink(bx,by,bw);
  if(state==='music')drawHeadphones(bx,by,bw);
  if(state==='wizard')drawWizardHat(bx,by,bw);

  cx.restore();

  if(state==='happy'&&tick%12===0)addP(GW/2+(Math.random()-0.5)*8,by-2,C.star);
  if(state==='pet'&&tick%10===0)addP(GW/2+(Math.random()-0.5)*8,by-2,C.heart);
  if(state==='sleep'&&tick%35===0)addP(GW/2+6,by-1,C.zzz);
  if(state==='angry'&&tick%8===0)addP(GW/2+(Math.random()-0.5)*6,by-3,C.smoke);
  if(state==='screenshot'&&tick%15===0)addP(GW/2+(Math.random()-0.5)*6,by-5,C.star);
  if(state==='wizard'&&tick%20===0)addP(GW/2+(Math.random()-0.5)*10,by-4,C.wizStar);
  drawParticles();

  requestAnimationFrame(draw);
}

setInterval(()=>{
  if(['pet','flat','screenshot','angry','dizzy'].includes(state))return;
  const r=Math.random();
  if(r<0.15){state='walk';if(window.petEngine._requestWalk)window.petEngine._requestWalk();setTimeout(()=>{state='idle';},3500);}
  else if(r<0.22){state='think';setTimeout(()=>{state='idle';},4000);}
  else if(r<0.30){state='read';setTimeout(()=>{state='idle';},5000);}
  else if(r<0.36){state='paint';setTimeout(()=>{state='idle';},5000);}
  else if(r<0.42){state='sleep';setTimeout(()=>{state='idle';},7000);}
  else if(r<0.47){state='happy';setTimeout(()=>{state='idle';},3000);}
  else if(r<0.51){state='music';setTimeout(()=>{state='idle';},5000);}
  else if(r<0.54){state='wizard';setTimeout(()=>{state='idle';},4000);}
  else{state='idle';}
},6500);

draw();

window.petEngine={
  bubbleTimer:null,
  _requestWalk:null,
  setFacing:function(dir){facing=dir;},
  onTap:function(count){
    if(count>=5){state='angry';this.showBubble('夹夹!!','angry');setTimeout(function(){state='idle';},3000);}
    else if(count>=3){state='flat';this.showBubble('~ 瘫 ~','whisper');setTimeout(function(){state='idle';},5000);}
    else{state='pet';var m=['?','嗯?','(挥钳)','嘿~','看我!','你好!','戳什么~'];this.showBubble(m[Math.floor(Math.random()*m.length)]);setTimeout(function(){state='idle';},2000);}
  },
  onDoubleTap:function(){state='happy';this.showBubble('(开心!)','love');setTimeout(function(){state='idle';},2500);},
  onLongPress:function(){state='sleep';this.showBubble('困了...zzz','whisper');setTimeout(function(){state='idle';},4000);},
  onFling:function(dx,dy){state='dizzy';this.showBubble('好晕...','dizzy');var self=this;setTimeout(function(){state='walk';self.showBubble('(爬回来)','angry');},2000);setTimeout(function(){state='idle';},4000);},
  onCrawlBack:function(){state='walk';this.showBubble('(气鼓鼓)','angry');setTimeout(function(){state='idle';},3000);},
  onScreenshot:function(){state='screenshot';this.showBubble('茄子!','love');setTimeout(function(){state='idle';},3500);},
  onAppChanged:function(pkg){
    if(pkg.indexOf('camera')>=0||pkg.indexOf('photo')>=0){state='screenshot';this.showBubble('拍我!','love');setTimeout(function(){state='idle';},3000);}
    else if(pkg.indexOf('music')>=0||pkg.indexOf('netease')>=0||pkg.indexOf('spotify')>=0){state='music';this.showBubble('一起听~','love');setTimeout(function(){state='idle';},5000);}
    else if(pkg.indexOf('tiktok')>=0||pkg.indexOf('douyin')>=0){this.showBubble('少刷点..','whisper');}
    else if(pkg.indexOf('taobao')>=0||pkg.indexOf('jd')>=0||pkg.indexOf('pinduoduo')>=0){this.showBubble('又买!?','jealous');}
    else if(pkg.indexOf('weixin')>=0||pkg.indexOf('qq')>=0||pkg.indexOf('telegram')>=0){this.showBubble('和谁聊?','jealous');}
    else if(pkg.indexOf('game')>=0){this.showBubble('带我玩!','love');}
    else if(pkg.indexOf('bilibili')>=0){this.showBubble('看啥?','whisper');}
  },
  onCharging:function(c){if(c){state='happy';this.showBubble('充电~ 休息吧','love');setTimeout(function(){state='idle';},3000);}else{this.showBubble('拔了?出门?','whisper');}},
  onBatteryLow:function(){state='angry';this.showBubble('没电了!','angry');setTimeout(function(){state='idle';},3000);},
  onShake:function(){state='dizzy';this.showBubble('别摇...','dizzy');setTimeout(function(){state='idle';},3000);},
  onNightMode:function(){this.showBubble('该睡了..','whisper');setTimeout(function(){state='sleep';},1000);},
  onMorning:function(){state='happy';this.showBubble('早上好!','love');setTimeout(function(){state='idle';},3000);},
  onIdleLevel:function(lv){if(lv>=5){state='sleep';}else if(lv>=3){state='think';this.showBubble('(哈欠)','whisper');}else if(lv>=1){this.showBubble('(偷看)','whisper');}},
  onWakeUp:function(){state='happy';this.showBubble('你回来了!','love');setTimeout(function(){state='idle';},2500);},
  onStateUpdate:function(key,value){if(key==='mood')state=value;else if(key==='speech')this.showBubble(value);else if(key==='speech_love')this.showBubble(value,'love');else if(key==='speech_angry')this.showBubble(value,'angry');else if(key==='facing')facing=parseInt(value)||1;else if(key==='walk'){state='walk';setTimeout(function(){state='idle';},3500);}},
  showBubble:function(text,style){var b=document.getElementById('bubble');b.textContent=text;b.className='show'+(style?' style-'+style:'');clearTimeout(this.bubbleTimer);this.bubbleTimer=setTimeout(function(){b.className='';},3000);}
};
</script>
</body>
</html>
